<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Unhinged</title>
<meta name="description" content="Someone sent you a profile. Swipe wisely.">
<meta name="theme-color" content="#f6f3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<!-- Link preview in iMessage / WhatsApp / Instagram DMs.
     For a preview image, set og:image to a FULL url once hosted, e.g. https://your-site.netlify.app/photos/1.jpg -->
<meta property="og:title" content="Unhinged">
<meta property="og:description" content="You have a new profile to review.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one phone-width column. App bar on top, a scrolling profile card you can drag sideways, action buttons pinned to the bottom. */
:root {
  --bg: #f6f3f1;
  --card: #ffffff;
  --ink: #1d1a1c;
  --muted: #77707a;
  --line: #e7e1e4;
  --accent: #6b2f5b;
  --yes: #2f7a55;
  --no: #b3373b;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --body: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
  position: fixed;
  inset: 0;
}
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.app {
  height: 100%;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-top: env(safe-area-inset-top, 0px);
}

/* App bar */
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px));
}
.logo {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: -0.01em;
  line-height: 1;
}
.logo i { color: var(--accent); }
.bar-icons { display: flex; gap: 18px; color: var(--ink); }
.bar-icons svg { width: 22px; height: 22px; display: block; }

/* Card stage */
.stage {
  flex: 1;
  position: relative;
  min-height: 0;
}
.card {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px max(12px, env(safe-area-inset-left, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px));
  touch-action: pan-y;
  will-change: transform;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.card.nudge { animation: nudge 1.1s ease-in-out 0.9s 1; }
@keyframes nudge {
  0%, 100% { transform: none; }
  30% { transform: translateX(-22px) rotate(-1.2deg); }
  65% { transform: translateX(22px) rotate(1.2deg); }
}
.card::-webkit-scrollbar { display: none; }
.card.flying { transition: transform 0.45s cubic-bezier(.2,.7,.3,1), opacity 0.45s; }
.card.snap { transition: transform 0.3s cubic-bezier(.2,.9,.3,1.2); }
.profile { display: flex; flex-direction: column; gap: 12px; }

.name-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 6px 6px 2px;
}
.name {
  font-family: var(--display);
  font-size: clamp(34px, 10.5vw, 44px);
  line-height: 1;
  margin: 0;
}
.active-pill {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.active-pill::before {
  content: "";
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--yes);
}

.photo {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  aspect-ratio: 4 / 5;
  max-width: 100%;
  background: var(--line);
}
.photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  -webkit-user-drag: none;
  user-select: none;
  pointer-events: none;
}
.photo.placeholder {
  display: grid;
  place-items: center;
  color: rgba(255,255,255,.9);
  font-family: var(--display);
  font-size: 26px;
  font-style: italic;
  text-align: center;
  padding: 24px;
}
.like-btn {
  position: absolute;
  right: 12px; bottom: 12px;
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 0;
  background: var(--card);
  color: var(--accent);
  display: grid; place-items: center;
  box-shadow: 0 2px 10px rgba(29,26,28,.18);
  cursor: pointer;
}
.like-btn svg { width: 22px; height: 22px; }
.like-btn:active { transform: scale(.92); }

.prompt {
  position: relative;
  background: var(--card);
  border-radius: 10px;
  padding: 26px 22px 64px;
}
.prompt .q {
  font-size: 14px;
  font-weight: 500;
  margin: 0 0 10px;
}
.prompt .a {
  font-family: var(--display);
  font-size: clamp(26px, 8vw, 32px);
  line-height: 1.12;
  margin: 0;
  text-wrap: balance;
}

.prompt.flag .q {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--yes);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-size: 12px;
}
.prompt.flag .q::before {
  content: "";
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--yes);
  box-shadow: 0 0 0 4px rgba(47,122,85,.15);
}

.vitals {
  background: var(--card);
  border-radius: 10px;
  overflow: hidden;
}
.vitals-top {
  display: flex;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}
.vitals-top::-webkit-scrollbar { display: none; }
.vital-chip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 16px;
  font-weight: 500;
  border-right: 1px solid var(--line);
  white-space: nowrap;
}
.vital-chip:last-child { border-right: 0; }
.vital-chip svg, .vital-row svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.vital-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  font-weight: 500;
}
.vital-row:last-child { border-bottom: 0; }

.end-note {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 10px 0 0;
}

/* Swipe stamps */
.stamp {
  position: absolute;
  top: 70px;
  z-index: 5;
  font-family: var(--body);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: .08em;
  padding: 4px 14px;
  border: 4px solid currentColor;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  background: rgba(255,255,255,.85);
}
.stamp.yes { left: 28px; color: var(--yes); transform: rotate(-14deg); }
.stamp.no { right: 28px; color: var(--no); transform: rotate(14deg); }

/* Bottom actions */
.actions {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 max(20px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  z-index: 10;
}
.act {
  pointer-events: auto;
  width: 62px; height: 62px;
  border-radius: 50%;
  border: 0;
  background: var(--card);
  display: grid; place-items: center;
  box-shadow: 0 4px 16px rgba(29,26,28,.2);
  cursor: pointer;
  scale: var(--s, 1);
  transition: transform .15s, scale .25s ease-out;
}
.act.no.runaway {
  position: fixed;
  z-index: 15;
  transition: transform .15s, scale .25s ease-out, left .22s cubic-bezier(.2,.8,.3,1.2), top .22s cubic-bezier(.2,.8,.3,1.2);
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  top: calc(64px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  z-index: 40;
  background: var(--ink);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 999px;
  white-space: nowrap;
  animation: rise .3s ease-out;
}

/* Are-you-sure sheet */
.sheet-back {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(29,26,28,.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fade .2s ease-out;
}
.sheet {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: 18px 18px 0 0;
  padding: 26px max(22px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: rise .3s cubic-bezier(.2,.8,.3,1);
}
.sheet h3 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 34px;
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}
.sheet p { margin: 0 0 6px; color: var(--muted); }
.sheet button {
  font: 500 16px var(--body);
  border-radius: 999px;
  padding: 14px 18px;
  cursor: pointer;
  border: 0;
}
.sheet .stay { background: var(--accent); color: #fff; }
.sheet .leave { background: transparent; color: var(--muted); font-size: 14px; padding: 8px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

#confetti {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 25;
  pointer-events: none;
}
.act:active { transform: scale(.9); }
.act:focus-visible, .like-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.act svg { width: 26px; height: 26px; }
.act.no { color: var(--ink); }
.act.yes { color: var(--accent); }
.swipe-hint {
  align-self: center;
  font-size: 12px;
  color: var(--muted);
  background: var(--card);
  padding: 6px 12px;
  border-radius: 999px;
  box-shadow: 0 2px 10px rgba(29,26,28,.12);
  pointer-events: none;
}

/* Result screen */
.result {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  padding: 24px max(28px, env(safe-area-inset-left, 0px)) 24px max(28px, env(safe-area-inset-right, 0px));
  background: var(--accent);
  color: #fff;
  animation: rise .5s cubic-bezier(.2,.8,.3,1);
}
.result.left { background: var(--ink); }
.result h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(44px, 14vw, 60px);
  line-height: .95;
  margin: 0;
  text-wrap: balance;
}
.result h2 i { opacity: .8; }
.result p { margin: 0; max-width: 30ch; opacity: .85; font-size: 16px; }
.result .avatar {
  width: 112px; height: 112px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid rgba(255,255,255,.9);
  background: rgba(255,255,255,.2);
}
.result button {
  margin-top: 8px;
  font: 500 14px var(--body);
  color: inherit;
  background: transparent;
  border: 1.5px solid rgba(255,255,255,.6);
  border-radius: 999px;
  padding: 10px 20px;
  cursor: pointer;
}
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .card.flying, .card.snap { transition: none; }
  .card.nudge { animation: none; }
  .result, .sheet, .sheet-back, .toast { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo">Un<i>hinged</i></div>
    <div class="bar-icons" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="stamp yes" id="stampYes">YES</div>
    <div class="stamp no" id="stampNo">NOPE</div>
    <article class="card" id="card">
      <div class="profile" id="profile"></div>
    </article>
  </main>

  <div class="actions" id="actions">
    <button class="act no" id="btnNo" type="button" aria-label="Swipe left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <span class="swipe-hint">Swipe or tap</span>
    <button class="act yes" id="btnYes" type="button" aria-label="Swipe right">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 6.9 4.5c2 0 3.6 1.1 5.1 3 1.5-1.9 3.1-3 5.1-3 3.5 0 5.5 3.5 4.2 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
    </button>
  </div>
</div>

<script>
/* =====================================================================
   EDIT EVERYTHING IN THIS BLOCK
   ===================================================================== */
const CONFIG = {
  // Where swipes get reported. Fill in at least one.
  // 1) Email: make a free form at https://formspree.io and paste its endpoint.
  FORMSPREE_ENDPOINT: "",          // e.g. "https://formspree.io/f/abcdwxyz"
  // 2) Phone push (no account): install the ntfy app, subscribe to a hard-to-guess topic.
  NTFY_TOPIC: "",                  // e.g. "unhinged-ahmad-83kq"

  // 3) Text messages: a URL that accepts POST {message} and texts your phones.
  SMS_WEBHOOK: "",

  // Who this link was sent to (shows up in your notification, not on the page).
  SENT_TO: "the mystery recipient",
};

const PROFILE = {
  name: "Ahmad",
  age: 25,
  activeLabel: "Active now",
  // Put image files next to index.html (e.g. photos/1.jpg) or use full URLs.
  // Leave empty to see placeholder tiles.
  photos: [
    // "photos/1.jpg",
    // "photos/2.jpg",
    // "photos/3.jpg",
    // "photos/4.jpg",
  ],
  prompts: [
    { q: "I'm looking for", a: "Someone who will swipe right on this, specifically." },
    { q: "A promise I'll keep", a: "I will always take good photos of you." },
    { q: "Green flag", a: "Will learn how to cut apples for you.", flag: true },
    { q: "My most irrational fear", a: "That you're going to tap the X. Don't." },
    { q: "Together, we could", a: "Tell people we met on a dating app that doesn't exist." },
  ],
  vitals: {
    chips: [
      ["age", "25"],
      ["pin", "coffee shop cesspool"],
    ],
    rows: [
      ["work", "Professional dilly-dallier"],
      ["home", "Rawalpindi, Pakistan"],
      ["search", "Looking for: you, duh"],
    ],
  },
  endNote: "You've reached the end. Time to make a decision.",
};

const RESULT = {
  right: {
    title: "It's a <i>match.</i>",
    body: "Good choice. Ahmad has been notified and is probably acting very calm about it.",
  },
  left: {
    title: "Bold <i>move.</i>",
    body: "Ahmad has been notified. They're fine. Totally fine.",
  },
  changeMind: "Change your mind?",
};

// Shown one after another when they try to swipe left.
const ARE_YOU_SURE = [
  { title: "Are you sure?", body: "This is a very good profile.", stay: "No, take me back", leave: "Yes, swipe left" },
  { title: "Are you <i>really</i> sure?", body: "Think about all the good photos you'd get.", stay: "Okay, fine, take me back", leave: "Yes, I'm sure" },
  { title: "Ahmad's mom has been informed.", body: "She's not mad. Just disappointed.", stay: "I'll reconsider", leave: "Swipe left anyway" },
];
const RUNAWAY = { maxDodges: 5, giveUp: "Fine. The ✕ will stay still now." };
/* ===================================================================== */

const ICONS = {
  age: '<path d="M12 3v3M8 21h8M6 13h12v8H6zM9 13V9h6v4"/>',
  height: '<path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/>',
  pin: '<path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  drink: '<path d="M6 3h12l-1.5 7a4.5 4.5 0 01-9 0L6 3zM12 14.5V21M8 21h8"/>',
  work: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/>',
  school: '<path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',
  home: '<path d="M3 11l9-7 9 7M5 9.5V20h14V9.5"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.search}</svg>`;
const heart = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 6.9 4.5c2 0 3.6 1.1 5.1 3 1.5-1.9 3.1-3 5.1-3 3.5 0 5.5 3.5 4.2 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const PLACEHOLDER_BG = [
  "linear-gradient(160deg,#8a4a78,#3d1f37)",
  "linear-gradient(160deg,#c98a6b,#6b3b2c)",
  "linear-gradient(160deg,#5e7f8f,#24343d)",
  "linear-gradient(160deg,#9b9a5f,#4a4a26)",
];

function photoHTML(i) {
  const src = PROFILE.photos[i];
  const btn = `<button class="like-btn" type="button" aria-label="Like this photo" data-like>${heart}</button>`;
  if (src) return `<div class="photo"><img src="${esc(src)}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} decoding="async" alt="Photo ${i + 1} of ${esc(PROFILE.name)}" draggable="false">${btn}</div>`;
  return `<div class="photo placeholder" style="background:${PLACEHOLDER_BG[i % PLACEHOLDER_BG.length]}">Photo ${i + 1}${btn}</div>`;
}
function promptHTML(p) {
  return `<section class="prompt${p.flag ? " flag" : ""}"><p class="q">${esc(p.q)}</p><p class="a">${esc(p.a)}</p><button class="like-btn" type="button" aria-label="Like this answer" data-like>${heart}</button></section>`;
}

function render() {
  const nPhotos = Math.max(PROFILE.photos.length, 4);
  const parts = [`<div class="name-row"><h1 class="name">${esc(PROFILE.name)}</h1><span class="active-pill">${esc(PROFILE.activeLabel)}</span></div>`];
  parts.push(photoHTML(0));
  parts.push(PROFILE.prompts[0] ? promptHTML(PROFILE.prompts[0]) : "");
  const v = PROFILE.vitals;
  parts.push(`<section class="vitals"><div class="vitals-top">${v.chips.map(([k, t]) => `<div class="vital-chip">${icon(k)}${esc(t)}</div>`).join("")}</div>${v.rows.map(([k, t]) => `<div class="vital-row">${icon(k)}${esc(t)}</div>`).join("")}</section>`);
  // Interleave remaining photos and prompts, Hinge-parody style.
  let pi = 1, qi = 1;
  while (pi < nPhotos || qi < PROFILE.prompts.length) {
    if (pi < nPhotos) parts.push(photoHTML(pi++));
    if (pi < nPhotos) parts.push(photoHTML(pi++));
    if (qi < PROFILE.prompts.length) parts.push(promptHTML(PROFILE.prompts[qi++]));
  }
  parts.push(`<p class="end-note">${esc(PROFILE.endNote)}</p>`);
  document.getElementById("profile").innerHTML = parts.join("");
}
render();

/* ---------- Sneaky stats (only sent to you) ---------- */
const t0 = performance.now();
const stats = { maxScroll: 0, dodges: 0, backouts: 0, changedMind: false };
const fmtTime = s => s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;

/* ---------- Notifications ---------- */
function notify(choice, how) {
  const secs = Math.round((performance.now() - t0) / 1000);
  const verdict = choice === "right" ? "swiped RIGHT ❤️" : "swiped LEFT ✖️";
  const details = [
    `Looked for ${fmtTime(secs)}`,
    `scrolled ${Math.round(stats.maxScroll * 100)}% of the profile`,
    `chased the ✕ ${stats.dodges} time${stats.dodges === 1 ? "" : "s"}`,
    `backed out of swiping left ${stats.backouts} time${stats.backouts === 1 ? "" : "s"}`,
  ];
  if (stats.changedMind) details.push("changed their mind");
  const message = `${CONFIG.SENT_TO} ${verdict} on your Unhinged profile (${how}).\n${details.join(", ")}.`;
  const payload = {
    _subject: `Unhinged: ${verdict}`,
    message,
    choice,
    how,
    seconds_looking: secs,
    scrolled_percent: Math.round(stats.maxScroll * 100),
    x_dodges: stats.dodges,
    left_swipe_backouts: stats.backouts,
    changed_mind: stats.changedMind ? "yes" : "no",
    time: new Date().toString(),
  };
  const post = (url, opts) => fetch(url, Object.assign({ method: "POST", keepalive: true }, opts)).catch(() => {});
  const jobs = [];
  if (CONFIG.FORMSPREE_ENDPOINT) {
    jobs.push(post(CONFIG.FORMSPREE_ENDPOINT, {
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(payload),
    }));
  }
  if (CONFIG.NTFY_TOPIC) {
    jobs.push(post("https://ntfy.sh/" + encodeURIComponent(CONFIG.NTFY_TOPIC), {
      body: message,
      headers: { Title: "Unhinged: " + verdict.replace(/[^\x20-\x7e]/g, "").trim(), Tags: choice === "right" ? "heart" : "x" },
    }));
  }
  if (CONFIG.SMS_WEBHOOK) {
    jobs.push(post(CONFIG.SMS_WEBHOOK, {
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }));
  }
  return Promise.all(jobs);
}

/* ---------- Elements ---------- */
const card = document.getElementById("card");
const stampYes = document.getElementById("stampYes");
const stampNo = document.getElementById("stampNo");
const actions = document.getElementById("actions");
const btnNo = document.getElementById("btnNo");
const btnYes = document.getElementById("btnYes");
let decided = false;
let sheetOpen = false;

function setStamps(dx) {
  const t = Math.min(Math.abs(dx) / 110, 1);
  stampYes.style.opacity = dx > 0 ? t : 0;
  stampNo.style.opacity = dx < 0 ? t : 0;
}
function snapBack() {
  card.classList.remove("flying");
  card.classList.add("snap");
  card.style.transform = "";
  setStamps(0);
}
function toast(text) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- Shrinking ✕, growing ♥ ---------- */
// The further they scroll, the smaller ✕ gets and the bigger ♥ gets. It never grows back.
card.addEventListener("scroll", () => {
  const max = card.scrollHeight - card.clientHeight;
  const p = max > 0 ? Math.min(card.scrollTop / max, 1) : 0;
  if (p <= stats.maxScroll) return;
  stats.maxScroll = p;
  btnNo.style.setProperty("--s", (1 - 0.5 * p).toFixed(3));
  btnYes.style.setProperty("--s", (1 + 0.45 * p).toFixed(3));
}, { passive: true });

/* ---------- Runaway ✕ ---------- */
function dodge(e) {
  if (decided || sheetOpen || stats.dodges >= RUNAWAY.maxDodges) return;
  e.preventDefault();
  stats.dodges++;
  const r = btnNo.getBoundingClientRect();
  if (!btnNo.classList.contains("runaway")) {
    // Pin it where it is first, so the jump animates.
    btnNo.style.left = r.left + "px";
    btnNo.style.top = r.top + "px";
    btnNo.classList.add("runaway");
    document.querySelector(".swipe-hint").hidden = true;
    void btnNo.offsetWidth;
  }
  const vw = window.innerWidth, vh = window.innerHeight;
  const heart = btnYes.getBoundingClientRect();
  let x, y, tries = 0;
  do {
    x = 16 + Math.random() * (vw - r.width - 32);
    y = 90 + Math.random() * (vh - r.height - 200);
    tries++;
  } while (tries < 30 && (
    Math.hypot(x - r.left, y - r.top) < 140 ||
    (x + r.width > heart.left - 20 && y + r.height > heart.top - 20)
  ));
  btnNo.style.left = x + "px";
  btnNo.style.top = y + "px";
  try { navigator.vibrate && navigator.vibrate(8); } catch (_) {}
  if (stats.dodges === RUNAWAY.maxDodges) setTimeout(() => toast(RUNAWAY.giveUp), 300);
}
btnNo.addEventListener("touchstart", dodge, { passive: false });
btnNo.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") dodge(e); });
btnNo.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") dodge(e); });

/* ---------- Are you sure? ---------- */
function requestLeft(how) {
  if (decided || sheetOpen) return;
  snapBack();
  askSure(0, how);
}
function askSure(step, how) {
  sheetOpen = true;
  const s = ARE_YOU_SURE[step];
  const back = document.createElement("div");
  back.className = "sheet-back";
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${s.title}</h3><p>${esc(s.body)}</p>` +
    `<button type="button" class="stay">${esc(s.stay)}</button><button type="button" class="leave">${esc(s.leave)}</button></div>`;
  const close = () => { back.remove(); sheetOpen = false; };
  back.querySelector(".stay").addEventListener("click", () => { stats.backouts++; close(); });
  back.addEventListener("click", e => { if (e.target === back) { stats.backouts++; close(); } });
  back.querySelector(".leave").addEventListener("click", () => {
    close();
    if (step + 1 < ARE_YOU_SURE.length) askSure(step + 1, how);
    else decide("left", how);
  });
  document.body.appendChild(back);
  back.querySelector(".stay").focus({ preventScroll: true });
}

/* ---------- Deciding ---------- */
function decide(choice, how) {
  if (decided) return;
  decided = true;
  try { navigator.vibrate && navigator.vibrate(choice === "right" ? [12, 40, 18] : 15); } catch (_) {}
  const dir = choice === "right" ? 1 : -1;
  card.classList.remove("snap");
  card.classList.add("flying");
  card.style.transform = `translateX(${dir * 140}%) rotate(${dir * 18}deg)`;
  card.style.opacity = "0";
  setStamps(dir * 200);
  actions.hidden = true;
  notify(choice, how);
  setTimeout(() => showResult(choice), 380);
}

function showResult(choice) {
  stampYes.style.opacity = stampNo.style.opacity = 0;
  const r = RESULT[choice];
  const el = document.createElement("div");
  el.className = "result " + choice;
  const firstPhoto = PROFILE.photos[0];
  el.innerHTML =
    (firstPhoto ? `<img class="avatar" src="${esc(firstPhoto)}" alt="">` : "") +
    `<h2>${r.title}</h2><p>${esc(r.body)}</p>` +
    `<button type="button">${esc(RESULT.changeMind)}</button>`;
  el.querySelector("button").addEventListener("click", () => {
    el.remove();
    stats.changedMind = true;
    decided = false;
    card.classList.remove("flying");
    card.style.opacity = "1";
    card.style.transform = "";
    card.scrollTop = 0;
    actions.hidden = false;
  });
  document.querySelector(".app").appendChild(el);
  if (choice === "right") confetti();
}

/* ---------- Confetti ---------- */
function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas");
  c.id = "confetti";
  document.body.appendChild(c);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = c.width = window.innerWidth * dpr;
  const H = c.height = window.innerHeight * dpr;
  const ctx = c.getContext("2d");
  const colors = ["#f6c945", "#ff8fb1", "#ffffff", "#7fd3a8", "#c9a7ff", "#ff6b6b"];
  const bits = Array.from({ length: 160 }, (_, i) => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.3,
    y: H * 0.45,
    vx: (Math.random() - 0.5) * 18 * dpr,
    vy: (-Math.random() * 20 - 8) * dpr,
    w: (6 + Math.random() * 6) * dpr,
    h: (8 + Math.random() * 10) * dpr,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.3,
    color: colors[i % colors.length],
  }));
  const start = performance.now();
  (function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = t > 2600 ? Math.max(0, 1 - (t - 2600) / 900) : 1;
    for (const b of bits) {
      b.vy += 0.55 * dpr;
      b.vx *= 0.99;
      b.vy *= 0.99;
      b.x += b.vx;
      b.y += b.vy;
      b.rot += b.vr;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.color;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot * 2)));
      ctx.restore();
    }
    if (t < 3500) requestAnimationFrame(frame);
    else c.remove();
  })(start);
}

/* ---------- Swiping ---------- */
let startX = 0, startY = 0, dx = 0, dragging = false, locked = null, pid = null;
let lastX = 0, lastT = 0, vx = 0; // px per ms, for quick flicks
card.addEventListener("pointerdown", e => {
  if (decided || sheetOpen || e.button > 0) return;
  startX = lastX = e.clientX; startY = e.clientY; dx = 0; vx = 0; lastT = e.timeStamp;
  dragging = true; locked = null; pid = e.pointerId;
  card.classList.remove("snap", "flying", "nudge");
});
card.addEventListener("pointermove", e => {
  if (!dragging || e.pointerId !== pid) return;
  const mx = e.clientX - startX, my = e.clientY - startY;
  if (locked === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
    locked = Math.abs(mx) > Math.abs(my) ? "x" : "y";
    if (locked === "x") { try { card.setPointerCapture(pid); } catch (_) {} }
  }
  if (locked !== "x") return;
  e.preventDefault();
  const dt = e.timeStamp - lastT;
  if (dt > 0) vx = 0.7 * ((e.clientX - lastX) / dt) + 0.3 * vx;
  lastX = e.clientX; lastT = e.timeStamp;
  dx = mx;
  card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
  setStamps(dx);
});
function endDrag(e) {
  if (!dragging || (e && e.pointerId !== pid)) return;
  dragging = false;
  if (locked !== "x") return;
  const threshold = Math.min(110, card.clientWidth * 0.26);
  const flick = Math.abs(vx) > 0.6 && Math.abs(dx) > 40 && Math.sign(vx) === Math.sign(dx);
  if (dx > threshold || (flick && dx > 0)) return decide("right", "swiped");
  if (dx < -threshold || (flick && dx < 0)) return requestLeft("swiped");
  snapBack();
}
card.addEventListener("pointerup", endDrag);
card.addEventListener("pointercancel", endDrag);
// Swallow the click that follows a drag so it doesn't hit a like button.
card.addEventListener("click", e => { if (Math.abs(dx) > 8) { e.stopPropagation(); e.preventDefault(); dx = 0; } }, true);

btnYes.addEventListener("click", () => decide("right", "tapped ♥"));
btnNo.addEventListener("click", () => requestLeft("tapped ✕"));
card.addEventListener("click", e => { if (e.target.closest("[data-like]")) decide("right", "liked a photo or prompt"); });

// A small left-right wiggle on open so people know the card swipes.
card.classList.add("nudge");
card.addEventListener("animationend", () => card.classList.remove("nudge"));
// Keep iOS from zooming on pinch or double-tap.
document.addEventListener("gesturestart", e => e.preventDefault());

document.addEventListener("keydown", e => {
  if (sheetOpen) return;
  if (e.key === "ArrowRight") decide("right", "keyboard");
  if (e.key === "ArrowLeft") requestLeft("keyboard");
});
</script>
</body>
</html>
